apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cathaybank
  labels:
    cloud.googleapis.com/location: us-west1
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/client-name: gcloud
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: us-west1-docker.pkg.dev/cathay-bank-usa/cathay-repo/cathaybank:latest
        ports:
        - name: http1
          containerPort: 3000
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: NODE_ENV
          value: production
        - name: CLOUD_RUN_REGION
          value: us-west1
